steps:
  - name: docker-build-push
    image: woodpeckerci/plugin-docker-buildx
    settings:
      repo: registry.digitalocean.com/${CI_REPO_OWNER}/${CI_REPO_NAME}
      target: base
      registry: registry.digitalocean.com
      tags: 
        - php-8.4-1-base
        - ${CI_COMMIT_TAG}-base
        - latest-base
      dry-run: false
      username:
        from_secret: docker_password      
      password:
        from_secret: docker_password
    when:
      - event: tag
        ref: refs/tags/[0-9]*.[0-9]*.[0-9]*-base
